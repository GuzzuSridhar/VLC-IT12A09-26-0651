<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <!-- text input -->
        <label for="username">Username:</label>
        <input type="text" name="username" id="username" placeholder="Enter your name" required>
        <hr>
        <!-- password input -->
        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password">
        <hr>
        <!-- number input -->
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" placeholder="Enter your age">
        <hr>
        <!-- email input -->
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email">
        <hr>
        <!-- tel input -->
        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" placeholder="Enter your phone number">
        <hr>
        <!-- date input -->
        <label for="date">Date:</label>
        <input type="date" name="date" id="date" placeholder="Enter your date">
        <hr>
        <!-- time input -->
        <label for="time">Time:</label>
        <input type="time" name="time" id="time" placeholder="Enter your time">
        <hr>
        <!-- datetime-local input -->
        <label for="datetime-local">Date and Time:</label>
        <input type="datetime-local" name="datetime-local" id="datetime-local" placeholder="Enter your date and time">
        <hr>
        <!-- month input -->
        <label for="month">Month:</label>
        <input type="month" name="month" id="month" placeholder="Enter your month">
        <hr>
        <!-- week input -->
        <label for="week">Week:</label>
        <input type="week" name="week" id="week" placeholder="Enter your week">
        <hr>
        <!-- color input -->
        <label for="color">Color:</label>
        <input type="color" name="color" id="color" placeholder="Enter your color">
        <hr>
        <!-- range input -->
        <label for="range">Range:</label>
        <input type="range" name="range" id="range" placeholder="Enter your range">
        <hr>
        <!-- search input -->
        <label for="search">Search:</label>
        <input type="search" name="search" id="search" placeholder="Enter your search">
        <hr>
        <!-- url input -->
        <label for="url">URL:</label>
        <input type="url" name="url" id="url" placeholder="Enter your URL">
        <hr>
        <!-- radio buttons -->
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other</label>
        <hr>
        <!-- checkbox -->
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" name="hobbies" id="reading" value="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" name="hobbies" id="writing" value="writing">
        <label for="writing">Writing</label>
        <input type="checkbox" name="hobbies" id="drawing" value="drawing">
        <label for="drawing">Drawing</label>
        <hr>
        <!-- submit button -->
        <input type="submit" value="Submit">
        <!-- reset button -->
        <input type="reset" value="Reset">
    </form>
</body>

</html>

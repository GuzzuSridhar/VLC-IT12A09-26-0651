<!DOCTYPE html>
<html lang="en">

<head>
  <title>YouTube in iframe</title>
</head>

<body>

  <div style="text-align: center; ">
    <h2>YouTube Video</h2>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/o4EgygGWrF8?si=PkcplkV7mrpzp2oF"
      title="YouTube video player" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      style="border-radius: 20px; border: none;" allowfullscreen>
    </iframe>

    <p>The youtube video above is being played in a iframe.</p>
  </div>


</body>

</html>

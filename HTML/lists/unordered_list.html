<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- unordered list -->
    <h3>Unordered List</h3>
    <h4>List of Fruits</h4>
    <!-- ul -- unordered list -->
    <!-- bulletted list -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <!-- List of web sites -->
    <h3>Look into the following for more information:</h3>
    <ul>
        <li><a href="https://www.google.com">Google</a></li>
        <li><a href="https://www.facebook.com">Facebook</a></li>
        <li><a href="https://www.yahoo.com">Yahoo</a></li>
        <li><a href="https://www.gmail.com">Gmail</a></li>
    </ul>

    <!-- changing the bullet style -->
    <h4>Different styles of bullets:</h4>
    <ul type="square">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <ul type="circle">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <ul type="disc">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>
</body>

</html>

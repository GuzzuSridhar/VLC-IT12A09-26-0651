<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- ordered list -->
    <h3>Ordered List</h3>
    <h4>List of fruits:</h4>
    <!-- ordered list -->
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <!-- changing the order style -->
    <h4>Different styles of orders:</h4>
    <ol type="i">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <ol type="I">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <ol type="a">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <ol type="A">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <!-- start attribute -->
    <h4>Start attribute:</h4>
    <ol start="5">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- working with images -->
    <!-- the src is a mandatory attribute, the alt is a mandatory attribute -->
    <!-- the src is the image source -->
    <!-- the text in the alt attribute is used when the image cannot be found / rendered -->
    <!-- if the image's height and width are not set, then the image will occupy the entire view port -->
    <h1>Working with Images</h1>
    <img src="/resources/img_1.jpg" alt="HTML Image" width="500" height="500">
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- apply style to image -->
    <img src="/resources/person.jpg" alt="HTML Image" width="200" height="200" style="border-radius: 40%;">
    <img src="/resources/person_2.jpg" alt="HTML Image" width="200" height="200" style="border-radius: 50%;">

    <!-- 2 ways to apply width and height -->
    <!-- using inline style allows only px as UoM-->
    <img src="/resources/person.jpg" alt="HTML Image" width="200" height="200" style="border-radius: 40%;">
    <!-- using css allows all possible UoM-->
    <img src="/resources/person_2.jpg" alt="HTML Image" style="width:10%; height:10%; border-radius: 20%;">
</body>

</html>

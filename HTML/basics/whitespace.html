<!-- html ignores white spaces in the content -->
<!-- for any reason if the white space has to be preserved use the <pre> -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>
        Leaving some spaces intentionally.
    </p>

    <pre>
        This is preformatted
        and hence              you see the
        spaces retained
    </pre>
</body>

</html>

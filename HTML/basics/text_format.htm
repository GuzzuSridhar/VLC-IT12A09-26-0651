<!-- to generate a basic template use "Shift + !" -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- text formatting with HTML -->
    <!-- provides 6 levels of headings (h1-h6)-->
    <!-- Empty tags are not rendered -->
    <h1>Headings</h1>
    <!-- horizontal rule -->
    <hr />
    <h1>Heading Level 1</h1>
    <h2>Heading Level 2</h2>
    <h3>Heading Level 3</h3>
    <h4>Heading Level 4</h4>
    <h5>Heading Level 5</h5>
    <h6>Heading Level 6</h6>
    <hr />
    <!-- bold text -->
    <b>This text is in bold</b>
    <!-- line break -->
    <br />
    <i>This is in italics</i>
    <br />
    <!-- strong text -->
    <strong>This is strong text</strong>
    <!-- the key words "Training" -->
    <br />
    <!-- emphasis -->
    <em>This is emphasised</em>
    <!-- marked text -->
    <br />
    <mark>This marked</mark>
  </body>
  <br />
  <!-- deleted text -->
  <del>the price is slashed from $ 10 </del>
  to
  <ins> $5</ins>
  <br />
  <!-- small text -->
  <small>This is small text</small>
  <br />
  <!-- subscript -->
  25<sub>8</sub>
  <br />
  <!-- superscript -->
  HTML<sup>1</sup>
  25<sup>2</sup>

  <br />
  <!-- code -->
  <code>import sys.io</code>
</html>

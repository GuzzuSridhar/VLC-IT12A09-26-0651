<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Working with tables</h1>
    <table>
        <colgroup>
            <col style="background-color: lightblue;">
            <col style="background-color: lightgreen;">
            <col style="background-color: lightgray;">
        </colgroup>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>100</td>
                <td>Alex</td>
                <td>1000</td>
            </tr>
            <tr>
                <td>101</td>
                <td>David</td>
                <td>5000</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Bill</td>
                <td>6000</td>
            </tr>
        </tbody>

    </table>

</body>

</html>

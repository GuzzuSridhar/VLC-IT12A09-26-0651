<!-- styling using the inline styles (using the style attribute)-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Working with Inline styles on tables</h1>
    <table style="border: 2px solid black; border-collapse: collapse;">
        <thead>
            <tr>
                <th style="border: 2px solid red;">ID</th>
                <th style="border: 2px solid black;">Name</th>
                <th style="border: 2px solid black;">Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="border: 1px solid black;">100</td>
                <td style="border: 1px solid black;">Alex</td>
                <td style="border: 1px solid black;">1000</td>
            </tr>
            <tr>
                <td style="border: 1px solid black;">101</td>
                <td style="border: 1px solid black;">David</td>
                <td style="border: 1px solid black;">5000</td>
            </tr>
            <tr>
                <td style="border: 1px solid black;">102</td>
                <td style="border: 1px solid black;">Bill</td>
                <td style="border: 1px solid black;">6000</td>
            </tr>
        </tbody>

    </table>

</body>

</html>

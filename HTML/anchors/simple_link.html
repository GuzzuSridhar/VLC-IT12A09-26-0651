<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Links</title>
</head>

<body>
    <!-- anchor tag -->
    <!-- anchor tag is inline-->
    <!-- anchor tag <a> has a mandatory attribute href that specifies the address of the resource  -->

    <!-- link to a external site -->
    <p>
        Please visit <a href="https://www.google.com">Google</a>
    </p>

    <!-- link to resource or page on the same site -->
    <p>
        <a href="anotherPage.html">Link to another page</a>
    </p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Attribute</title>
</head>

<body>
    <!-- target attribute specifies where the linked document opens  -->
    <!-- _blank opens the linked document in a new browser tab or window -->
    <!-- _self opens the linked document in the same browser tab or window -->
    <!-- _parent opens the linked document in the parent frame -->
    <!-- _top opens the linked document in the top-level frame -->
    <p>
        <a href="https://www.google.com" target="_blank">Google in a new tab</a>
    </p>
    <p>
        <a href="anotherPage.html" target="_self">Another Page in the same tab</a>
    </p>
    <p>
        <a href="anotherPage.html" target="_parent">Another Page in the parent frame</a>
    </p>
    <p>
        <a href="anotherPage.html" target="_top">Another Page in the top-level frame</a>
    </p>
</body>

</html>

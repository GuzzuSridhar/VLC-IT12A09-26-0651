<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Using functions in Java Script</h1>
    <h2>function is block of code used to perform specific task</h2>
    <p>it helps in code reusability</p>
    <!-- the same function showMessage() is called on both the button clicks -->
    <button onclick="showMessage()">call function one </button>
    <button onclick="showMessage()">call function two </button>
    <script>
        function showMessage() {
            console.log('button clicked')
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- blank element -->
    <h1 id="one"></h1>
    <button onclick="assignText()">click to assign text</button>
    <script>
        // assigning text
        function assignText() {
            document.getElementById('one').innerHTML = 'this text is assigned using js'
        }
    </script>

</body>

</html>

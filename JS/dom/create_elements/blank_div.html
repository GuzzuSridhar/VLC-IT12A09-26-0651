<!DOCTYPE html>
<html>

<body>

    <h2>Learning JavaScript</h2>
    <div id="container"></div>

    <script>
        // Step 1: Create a paragraph
        let para = document.createElement("p");

        // Step 2: Add text
        para.textContent = "Hello, World!";

        // Step 3: Append it to the div
        document.getElementById("container")
            .appendChild(para);
    </script>

</body>

</html>

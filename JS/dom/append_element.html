<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="p"></p>
    <button onclick="appendPara()">Append Paragraph</button>

    <script>
        function appendPara() {

            // without new line
            // document.getElementById('p').textContent += "This appended text"
            // console.log('1' + document.getElementById('p').textContent)
            // // with new line
            // document.getElementById('p').innerHtml += "<br> This appended text "
            // console.log('2' + document.getElementById('p').innerHTML)


            // without new line
            document.getElementById('p').textContent += "This appended text"
            console.log('1' + document.getElementById('p').textContent)
            // with new line
            let p = document.getElementById('p');
            let content = p.innerHTML;
            content = content.replaceAll("<br>", "");
            content = content.replaceAll("text", "text<br>");
            p.innerHTML = content
            console.log('2' + content)


        }
    </script>
</body>

</html>

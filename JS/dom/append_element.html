<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p id="p"></p>
    <button onclick="appendPara()">Append Paragraph</button>

    <script>
        function appendPara() {
            // without new line
            // document.getElementById('p').textContent += " This appended text"
            // with new line
            document.getElementById('p').innerHTML += " This appended text <br>"
        }
    </script>
</body>

</html>

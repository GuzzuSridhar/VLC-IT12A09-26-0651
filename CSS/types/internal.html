<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- uses style tag in the head section -->
    <!-- can be reused inside the same page -->
    <style>
        body {
            background-color: black;
        }

        h1 {
            color: blue;
        }

        p {
            color: green;
        }

        button {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Internal CSS</h1>
    <p>Internal CSS</p>
    <button>Internal CSS</button>
</body>

</html>

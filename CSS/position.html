<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relbox {
            width: 20vw;
            height: 20vh;
            background-color: rgb(243, 82, 13);
            /* move the element from current position */
            position: relative;
            /* move 20px down from original position */
            top: 20px;
            /* move 20px right from original position */
            left: 20px;
        }

        .absbox {
            width: 20vw;
            height: 20vh;
            background-color: rgb(9, 25, 246);
            /* move the element from current position */
            position: absolute;
            /* move 20px down from original position */
            top: 350px;
            /* move 20px right from original position */
            left: 550px;
        }
    </style>
</head>

<body>
    <div class="relbox"></div>
    <div class="absbox"></div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Selector</title>
    <!-- id selector is meant to apply the style set to a single element -->
    <style>
        #box {
            width: 300px;
            height: 100px;
            border: 3px solid black;
            color: chartreuse;
            background-color: rgb(5, 163, 23);
        }
    </style>
</head>

<body>
    <!-- the id should be unique in a html document -->
    <div id="box">Demo of id selector</div>
    <!-- <div id="box">Demo of id selector</div> -->
</body>

</html>

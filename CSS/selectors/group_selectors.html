<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group selectors</title>
    <style>
        /* id's or classes or elements can be grouped fpr common styles */

        /* grouping classes for common style set */
        .a,
        .b,
        .c {
            color: green;
        }

        /* individual styles for each class can be written */

        /* grouping styles for elements */
        table,
        th,
        td {
            border: 1px solid black;
        }

        /* seperate styles for individual elements */
        table {
            border-collapse: collapse;
        }

        th {
            background-color: burlywood;
            color: aliceblue;
        }

        td {
            background-color: bisque;
        }
    </style>

</head>

<body>
    <h1 class="a">Employee List</h1>
    <h2 class="b">in My organization</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>100</td>
                <td>Alex</td>
            </tr>
            <tr>
                <td>101</td>
                <td>Bill</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Brown</td>
            </tr>
        </tbody>
    </table>
</body>

</html>

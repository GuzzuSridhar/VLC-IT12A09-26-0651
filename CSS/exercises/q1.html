<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .head {
            color: violet;
            text-align: center;
        }

        .card {
            background-color: rgb(142, 205, 205);

        }

        .container {

            border-radius: 5px;

            margin: auto;
            width: 50%;
        }

        #michael {
            color: blue;
        }

        #john {
            color: brown;
        }

        #emily {
            color: green;

        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="head">Student profiles</h2>
        <div class="card">
            <h4 id="john">John Smith</h4>
            <p>Course:HTML &amp; CSS</p>
            <p>John is learning</p>
        </div>
        <div class="card">
            <h4 id="emily">Emily Johnson</h4>
            <p>Course:JavaScript</p>
            <p>Emily is learning</p>
        </div>
        <div class="card">
            <h4 id="michael">Michael Brown</h4>
            <p>Course:React</p>
            <p>Michael is learning</p>
        </div>


    </div>


</body>

</html>
